name: AskDuka Preview Tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  preview-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install preview dependencies
        run: pip install fastapi==0.141.1 httpx==0.28.1 pytest==9.1.1 SQLAlchemy==2.0.52 psycopg[binary]==3.3.5
      - name: Run isolated preview tests
        run: python -m pytest tests/test_preview.py tests/test_generation_provider.py tests/test_webhook_signature.py tests/test_catalog_api.py tests/test_catalog_postgres_integration.py tests/test_dashboard.py tests/test_admin_app.py tests/test_catalog_http_integration.py tests/test_evidence.py tests/test_catalog_answers.py tests/test_owner_security.py -q
