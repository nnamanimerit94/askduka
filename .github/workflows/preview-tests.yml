name: AskDuka Preview Tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  preview-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: askduka_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: askduka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U askduka_test -d askduka_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ASKDUKA_TEST_DATABASE_URL: postgresql+psycopg://askduka_test:test_password@localhost:5432/askduka_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install preview dependencies
        run: pip install fastapi==0.141.1 httpx==0.28.1 pytest==9.1.1 SQLAlchemy==2.0.52 psycopg[binary]==3.3.5
      - name: Run isolated preview tests
        run: python -m pytest tests/test_preview.py tests/test_generation_provider.py tests/test_webhook_signature.py tests/test_catalog_api.py tests/test_catalog_postgres_integration.py tests/test_dashboard.py tests/test_admin_app.py tests/test_catalog_http_integration.py tests/test_evidence.py tests/test_catalog_answers.py tests/test_owner_security.py tests/test_owner_models.py tests/test_owner_registration.py tests/test_owner_login.py tests/test_owner_sessions.py tests/test_owner_session_service.py tests/test_owner_auth_api.py tests/test_login_rate_limit.py tests/test_owner_auth_postgres_integration.py -q
