name: AskDuka Preview Tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  preview-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install preview dependencies
        run: pip install fastapi==0.141.1 httpx==0.28.1 pytest==9.1.1 SQLAlchemy==2.0.52 psycopg[binary]==3.3.5 python-multipart
      - name: Run isolated preview tests
        run: python -m pytest tests/test_preview.py tests/test_generation_provider.py tests/test_webhook_signature.py tests/test_catalog_api.py tests/test_catalog_postgres_integration.py tests/test_dashboard.py tests/test_admin_app.py tests/test_catalog_http_integration.py tests/test_evidence.py tests/test_catalog_answers.py tests/test_owner_security.py tests/test_owner_models.py tests/test_owner_registration.py tests/test_owner_login.py tests/test_owner_sessions.py tests/test_owner_session_service.py tests/test_owner_auth_api.py tests/test_login_rate_limit.py tests/test_owner_business_api.py tests/test_owner_documents_api.py tests/test_owner_document_upload.py tests/test_owner_document_indexing.py tests/test_owner_onboarding.py tests/test_owner_app_boundary.py tests/test_owner_app_http.py tests/test_owner_conversations_api.py tests/test_webhook_conversation_store.py tests/test_conversation_atomic_upsert.py tests/test_whatsapp_catalog_pipeline.py tests/test_whatsapp_outbound_config.py tests/test_message_receipt_claims.py -q
  owner-auth-postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: askduka_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: askduka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U askduka_test -d askduka_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ASKDUKA_TEST_DATABASE_URL: postgresql+psycopg://askduka_test:test_password@localhost:5432/askduka_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install database test dependencies
        run: pip install pytest==9.1.1 SQLAlchemy==2.0.52 psycopg[binary]==3.3.5 fastapi==0.141.1 httpx==0.28.1 python-multipart
      - name: Run owner authentication PostgreSQL integration test
        run: python -m pytest tests/test_owner_auth_postgres_integration.py tests/test_owner_auth_migrations.py tests/test_owner_onboarding_postgres_integration.py tests/test_owner_http_postgres_integration.py -q
  owner-documents-postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: askduka_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: askduka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U askduka_test -d askduka_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ASKDUKA_TEST_DATABASE_URL: postgresql+psycopg://askduka_test:test_password@localhost:5432/askduka_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document integration dependencies
        run: pip install pytest==9.1.1 SQLAlchemy==2.0.52 psycopg[binary]==3.3.5 fastapi==0.141.1 httpx==0.28.1 python-multipart
      - name: Test document upload and isolation over HTTP
        run: python -m pytest tests/test_owner_document_http_postgres_integration.py -q
  frontend-client-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frontend client test dependencies
        run: pip install pytest==9.1.1 requests python-dotenv
      - name: Test Benoond frontend API client
        run: cd dashboard && python -m pytest tests/test_api_client.py tests/test_auth_session_client.py -q
